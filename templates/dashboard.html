<!DOCTYPE html>
<html>
<head>
    <title>Multi-Instance Python Runner</title>
    <style>
        body { font-family: monospace; margin: 2em; }
        .sidebar { float: left; width: 200px; background: #f0f0f0; padding: 1em; }
        .main { margin-left: 240px; }
        textarea { width: 100%; height: 200px; font-family: monospace; }
        pre { background: #f4f4f4; padding: 1em; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .status-pending { color: orange; }
        .status-running { color: blue; }
        .status-completed { color: green; }
        .status-failed { color: red; }
        button { margin-top: 8px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h3>Instances</h3>
    <div id="instanceList"></div>
    <hr>
    <input type="text" id="newInstanceName" placeholder="new instance">
    <button onclick="createInstance()">Create</button>
</div>
<div class="main">
    <h1>Python Instance Runner</h1>
    <h2>Current instance: <span id="currentInstanceName"></span></h2>

    <h3>Submit New Task</h3>
    <textarea id="code" placeholder='# Example:
result = sum(range(10))
print("hello from task")
'># Example: compute something
result = sum(i*i for i in range(100))
</textarea>
    <br>
    <button onclick="submitTask()">Submit Task</button>
    <div id="submitResult"></div>

    <h3>Tasks (auto-refresh)</h3>
    <table id="taskTable">
        <thead>
            <tr><th>ID</th><th>Status</th><th>Result</th><th>Error</th><th>Stdout</th><th>Submitted</th></tr>
        </thead>
        <tbody id="taskBody"></tbody>
    </table>
</div>

<script>
    let currentInstance = null;

    function loadInstances() {
        fetch('/api/instances')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('instanceList');
                container.innerHTML = '';
                for (let inst of data.instances) {
                    const btn = document.createElement('button');
                    btn.textContent = inst;
                    btn.onclick = () => switchInstance(inst);
                    btn.style.display = 'block';
                    btn.style.margin = '4px';
                    if (currentInstance === inst) btn.style.fontWeight = 'bold';
                    container.appendChild(btn);
                    if (!currentInstance) switchInstance(inst);
                }
            });
    }

    function switchInstance(instName) {
        currentInstance = instName;
        document.getElementById('currentInstanceName').innerText = currentInstance;
        // Update URL without reload
        const url = new URL(window.location.href);
        url.searchParams.set('instance', currentInstance);
        window.history.pushState({}, '', url);
        refreshTasks();
        loadInstances(); // refresh bold indicator
    }

    function createInstance() {
        const name = document.getElementById('newInstanceName').value;
        if (!name) return;
        fetch('/api/instances', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        }).then(() => {
            document.getElementById('newInstanceName').value = '';
            loadInstances();
            switchInstance(name);
        });
    }

    function submitTask() {
        if (!currentInstance) return;
        const code = document.getElementById('code').value;
        fetch(`/api/${currentInstance}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('submitResult').innerHTML = `Task submitted: ${data.task_id}`;
            refreshTasks();
        });
    }

    function refreshTasks() {
        if (!currentInstance) return;
        fetch(`/api/${currentInstance}/tasks`)
            .then(res => res.json())
            .then(tasks => {
                const tbody = document.getElementById('taskBody');
                tbody.innerHTML = '';
                for (const [id, task] of Object.entries(tasks).reverse()) {
                    const row = tbody.insertRow();
                    row.insertCell(0).innerText = id.slice(0,8);
                    row.insertCell(1).innerHTML = `<span class="status-${task.status}">${task.status}</span>`;
                    row.insertCell(2).innerText = task.result !== undefined ? JSON.stringify(task.result) : '';
                    row.insertCell(3).innerText = task.error || '';
                    row.insertCell(4).innerText = (task.stdout || '').slice(0, 100);
                    row.insertCell(5).innerText = task.submitted_at ? new Date(task.submitted_at*1000).toLocaleTimeString() : '';
                }
            });
    }

    // Load instances and start polling
    loadInstances();
    setInterval(refreshTasks, 2000);
    setInterval(loadInstances, 5000);
</script>
</body>
</html>
