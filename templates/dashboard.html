<!DOCTYPE html>
<html>
<head>
    <title>Python Skill Runner</title>
    <style>
        body { font-family: monospace; margin: 2em; }
        input, select, button { font-size: 1em; margin: 0.5em 0; }
        pre { background: #f4f4f4; padding: 1em; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .status-pending { color: orange; }
        .status-running { color: blue; }
        .status-completed { color: green; }
        .status-failed { color: red; }
    </style>
</head>
<body>
    <h1>Python Skill Runner</h1>
    
    <h2>Submit a Skill</h2>
    <p>Enter a path relative to <code>skills/</code> (e.g., <code>math/fibonacci.py</code>)</p>
    <input type="text" id="skillPath" placeholder="skills/my_skill.py" size="50" list="skillList" />
    <datalist id="skillList"></datalist>
    <br>
    <button onclick="submitTask()">Run Skill</button>
    <div id="submitResult"></div>

    <h2>Available Skills</h2>
    <ul id="skillListUl"></ul>

    <h2>Task List (auto-refresh)</h2>
    <table id="taskTable">
        <thead>
            <tr><th>ID</th><th>Skill</th><th>Status</th><th>Result</th><th>Error</th><th>Stdout</th><th>Submitted</th></tr>
        </thead>
        <tbody id="taskBody"></tbody>
    </table>

    <script>
        function loadSkills() {
            fetch('/api/skills')
                .then(res => res.json())
                .then(skills => {
                    const datalist = document.getElementById('skillList');
                    const ul = document.getElementById('skillListUl');
                    datalist.innerHTML = '';
                    ul.innerHTML = '';
                    skills.forEach(skill => {
                        const option = document.createElement('option');
                        option.value = skill;
                        datalist.appendChild(option);
                        const li = document.createElement('li');
                        li.textContent = skill;
                        ul.appendChild(li);
                    });
                });
        }

        function submitTask() {
            const skillPath = document.getElementById('skillPath').value;
            if (!skillPath) {
                alert("Please enter a skill path");
                return;
            }
            fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ skill_path: skillPath })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('submitResult').innerHTML = `<span style="color:red">Error: ${data.error}</span>`;
                } else {
                    document.getElementById('submitResult').innerHTML = `Task submitted: ${data.task_id}`;
                }
                refreshTasks();
            });
        }

        function refreshTasks() {
            fetch('/api/tasks')
                .then(res => res.json())
                .then(tasks => {
                    const tbody = document.getElementById('taskBody');
                    tbody.innerHTML = '';
                    for (const [id, task] of Object.entries(tasks).reverse()) {
                        const row = tbody.insertRow();
                        row.insertCell(0).innerText = id.slice(0,8);
                        row.insertCell(1).innerText = task.skill_path || '';
                        row.insertCell(2).innerHTML = `<span class="status-${task.status}">${task.status}</span>`;
                        row.insertCell(3).innerText = task.result !== undefined ? JSON.stringify(task.result) : '';
                        row.insertCell(4).innerText = task.error || '';
                        row.insertCell(5).innerText = (task.stdout || '').slice(0, 100);
                        row.insertCell(6).innerText = task.submitted_at ? new Date(task.submitted_at*1000).toLocaleTimeString() : '';
                    }
                });
        }

        loadSkills();
        refreshTasks();
        setInterval(refreshTasks, 2000);
    </script>
</body>
</html>
